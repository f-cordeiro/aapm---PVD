<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Movimentação — AAPM SENAI</title>
    <link rel="stylesheet" href="/static/form_move.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Registrar movimentação</h1>

        {% if erro %}
            <div class="alert-error">{{ erro }}</div>
        {% endif %}

        <form action="/movimentacoes/nova" method="post" class="form-container">

            <div class="form-group">
                <label for="select-produto" class="form-label">Produto</label>
                <select name="produto_id" required id="select-produto" class="form-select">
                    <option value="">Selecione...</option>
                    {% for p in produtos %}
                        <option value="{{ p.id }}"
                                data-estoque="{{ p.estoque_atual }}"
                                data-preco="{{ p.preco }}"
                            {{ 'selected' if produto_id == p.id else '' }}>
                            {{ p.nome }} — estoque: {{ p.estoque_atual }}
                        </option>
                    {% endfor %}
                </select>
                <p id="info-estoque" class="info-badge" style="display:none">
                    Estoque atual: <strong id="valor-estoque">0</strong>
                </p>
            </div>

            <div class="form-group">
                <label for="select-tipo" class="form-label">Tipo de Movimentação</label>
                <select name="tipo" required id="select-tipo" class="form-select">
                    <option value="">Selecione...</option>
                    {% for t in tipos %}
                        <option value="{{ t.value }}">
                            {{ "▲ Entrada" if t.value == 'entrada' else "▼ Saída" }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="input-quantidade" class="form-label">Quantidade</label>
                    <input type="number"
                           name="quantidade"
                           min="1"
                           required
                           id="input-quantidade"
                           class="form-input"
                           placeholder="0">
                </div>

                <div class="form-group">
                    <label for="input-preco" class="form-label">Preço unitário (R$)</label>
                    <input type="number"
                           name="preco_unitario"
                           step="0.01"
                           min="0"
                           required
                           id="input-preco"
                           class="form-input"
                           placeholder="0,00">
                </div>
            </div>

            <div id="info-subtotal" class="subtotal-card" style="display:none">
                <span>Subtotal calculado:</span>
                <strong id="valor-subtotal">R$ 0,00</strong>
            </div>

            <div class="form-group">
                <label for="input-obs" class="form-label">Observação (opcional)</label>
                <input type="text"
                       name="observacao"
                       id="input-obs"
                       maxlength="255"
                       class="form-input"
                       placeholder="Ex: Compra fornecedor X, Venda balcão...">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Registrar</button>
                <a href="/movimentacoes" class="btn-outline">Cancelar</a>
            </div>

        </form>
    </div>

    <script>
        const selectProduto  = document.getElementById('select-produto');
        const inputQuantidade = document.getElementById('input-quantidade');
        const inputPreco     = document.getElementById('input-preco');
        const infoEstoque    = document.getElementById('info-estoque');
        const valorEstoque   = document.getElementById('valor-estoque');
        const infoSubtotal   = document.getElementById('info-subtotal');
        const valorSubtotal  = document.getElementById('valor-subtotal');

        selectProduto.addEventListener('change', function () {
            const option = this.options[this.selectedIndex];
            const estoque = option.dataset.estoque;
            const preco   = option.dataset.preco;

            if (estoque !== undefined) {
                valorEstoque.textContent = estoque;
                infoEstoque.style.display = 'inline-block';

                inputPreco.value = parseFloat(preco).toFixed(2);
            } else {
                infoEstoque.style.display = 'none';
            }

            atualizarSubtotal();
        });

        function atualizarSubtotal() {
            const qtd   = parseFloat(inputQuantidade.value) || 0;
            const preco = parseFloat(inputPreco.value) || 0;
            const total = qtd * preco;

            if (qtd > 0 && preco > 0) {
                valorSubtotal.textContent = total.toLocaleString('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                });
                infoSubtotal.style.display = 'flex';
            } else {
                infoSubtotal.style.display = 'none';
            }
        }

        inputQuantidade.addEventListener('input', atualizarSubtotal);
        inputPreco.addEventListener('input', atualizarSubtotal);
    </script>
</body>
</html>
