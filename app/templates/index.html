<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - AAPM</title>
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); height: 100vh; display: flex; justify-content: center; align-items: center; color: #ffffff;">

    <div style="background: rgba(255, 255, 255, 0.06); padding: 40px 30px; border-radius: 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);">
        
        <!-- Ícone decorativo ou espaço para Logo -->
        <div style="width: 70px; height: 70px; background: #00adb5; margin: 0 auto 20px auto; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 24px; box-shadow: 0 0 20px rgba(0, 173, 181, 0.5);">
            A
        </div>

        <h1 style="margin: 0 0 10px 0; font-size: 28px; font-weight: 600; letter-spacing: 0.5px;">Sistema da AAPM</h1>
        <p style="margin: 0 0 35px 0; font-size: 14px; color: #b0bec5; font-weight: 300;">Faça login para acessar o sistema</p>
        
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <!-- Botão de Entrar -->
            <a href="/auth/login" style="display: block; padding: 14px; background: #00adb5; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 15px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 173, 181, 0.3);" 
               onmouseover="this.style.background='#00c4ce'; this.style.transform='translateY(-2px)';" 
               onmouseout="this.style.background='#00adb5'; this.style.transform='translateY(0)';">
               Entrar
            </a>
            
            <!-- Botão de Criar Conta -->
            <a href="/auth/cadastro" style="display: block; padding: 14px; background: transparent; color: #00adb5; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 15px; border: 2px solid #00adb5; transition: all 0.3s ease;" 
               onmouseover="this.style.background='rgba(0, 173, 181, 0.1)'; this.style.transform='translateY(-2px)';" 
               onmouseout="this.style.background='transparent'; this.style.transform='translateY(0)';">
               Criar conta
            </a>
        </div>

        <div style="margin-top: 40px; font-size: 11px; color: #78909c; font-weight: 300;">
            &copy; 2026 AAPM. Todos os direitos reservados.
        </div>
    </div>

</body>
</html>
