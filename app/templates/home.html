<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pós - login</title>
    <!-- Linkando o mesmo CSS que o FastAPI gerencia -->
    <link rel="stylesheet" href="/static/home.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Avatar / Ícone de Usuário -->
        <div class="user-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="#00adb5" viewBox="0 0 16 16">
                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6" />
            </svg>
        </div>

        <h1 class="title">Olá, {{ usuario.nome }}</h1>

        <!-- Badge de Perfil/Role -->
        <div class="role-badge">
            Perfil: {{ usuario.role }}
        </div>

        <!-- Área de Conteúdo / Boas-vindas -->
        <div class="welcome-box">
            Você foi autenticado com sucesso no sistema da AAPM. Use o menu ou os acessos da sua conta para navegar.
        </div>

        <!-- Botão Sair -->
        <a href="/auth/logout" class="btn-logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                <path fill-rule="evenodd"
                    d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
            </svg>
            Sair do Sistema
        </a>

    </div>

</body>

</html>
