<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AAPM SENAI</title>
    <!-- CSS Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='index.css') }}">
</head>
<body>

    <div class="login-container">
        <!-- Lado Esquerdo: Banner SENAI com filtro e efeitos JS -->
        <div class="left-panel js-animated-background">
            <img src="{{ url_for('static', path='images/senai-imagem.jpg') }}" alt="Logo SENAI" class="senai-logo filtered-image">
            <div class="background-overlay"></div>
            <canvas id="canvas-matrix"></canvas>
        </div>

        <!-- Lado Direito: Formulário de Login -->
        <div class="right-panel">
            <div class="login-card">
                
                <!-- Cabeçalho do Card -->
                <div class="card-header">
                    <h2>LOGIN</h2>
                    <div class="divider"></div>
                    <img src="{{ url_for('static', path='uploads/senai.png') }}" alt="Logo AAPM SENAI" class="aapm-logo">
                </div>

                <!-- Formulário conectado à rota /auth/login -->
                <form action="/auth/login" method="POST" class="login-form">
                    <div class="input-group">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" name="email" placeholder="Usuário" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" name="senha" placeholder="Senha" required>
                    </div>

                    <button type="submit" class="btn-login">LOGIN</button>
                </form>

            </div>
        </div>
    </div>

    <!-- Script de efeitos JS -->
    <script src="{{ url_for('static', path='js/effects.js') }}"></script>
</body>
</html>
